server:
  port: ${PORT:8080}

spring:
  application:
    name: urlshortener

  # PostgreSQL Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlshortener}?sslmode=${DB_SSLMODE:prefer}}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 5000ms

# Application custom configurations
app:
  base-url: ${APP_BASE_URL:https://swift.link}
  cache:
    ttl-hours: 24
  rate-limit:
    capacity: 15              # Max tokens in bucket
    refill-tokens: 15         # Refill tokens count
    refill-duration-seconds: 60 # Refill window in seconds (15 req / min)

# Actuator Endpoints for health and metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
